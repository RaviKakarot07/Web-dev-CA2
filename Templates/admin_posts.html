{% extends "base.html" %}
{% block content %}

<h2>All Posts</h2>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th><th>Title</th><th>Owner</th><th>Actions</th>
        </tr>
    </thead>
    <tbody>
    {% for p in posts %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.title }}</td>
            <td>{{ p.username }}</td>
            <td>
                <a href="/view/{{ p.id }}" class="btn btn-info btn-sm">View</a>
                <a href="/edit/{{ p.id }}" class="btn btn-warning btn-sm">Edit</a>
                <a href="/delete/{{ p.id }}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
