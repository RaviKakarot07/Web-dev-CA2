{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h3>{{ record['title'] }}</h3>
    <p>{{ record['content'] | safe }}</p>
    <p class="small text-muted">Owner: {{ record['username'] }}</p>
    <a href="{{ url_for('edit_item', item_id=record['id']) }}" class="btn btn-outline-secondary">Edit</a>
    <a href="{{ url_for('delete_item', item_id=record['id']) }}" class="btn btn-outline-danger">Delete</a>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">Back</a>
  </div>
</div>
{% endblock %}
