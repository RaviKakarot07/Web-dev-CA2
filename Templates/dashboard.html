{% extends "base.html" %}
{% block content %}

<h1 class="h3 mb-4 text-gray-800">Dashboard</h1>
<div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card border-left-primary shadow h-100 py-2">
            <div class="card-body">
                <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                    Total Items
                </div>
                <div class="h5 mb-0 font-weight-bold text-gray-800">{{ total_items }}</div>
            </div>
        </div>
    </div>

</div>
<!-- Table of items -->
<div class="card shadow mb-4">
    <div class="card-body">
        <h5 class="mb-3">Your Items</h5>
        <table class="table table-bordered">
            <thead class="thead-light">
                <tr>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.title }}</td>
                    <td>
                        <a href="/edit/{{ item.id }}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="/view/{{ item.id }}" class="btn btn-sm btn-info">View</a>
                        <a href="/delete/{{ item.id }}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
