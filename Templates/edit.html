{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card glass-card shadow">
      <div class="card-body">
        <h3 class="card-title text-white mb-3">{{ 'Edit' if rec else 'Add' }} Record</h3>
        <form method="post" action="{{ url_for('edit_item', item_id=rec['id']) if rec else url_for('add_item') }}">
          {% if rec %}
            <input type="hidden" name="id" value="{{ rec['id'] }}">
          {% endif %}
          <div class="mb-3">
            <label class="form-label text-muted">Title</label>
            <input name="title" class="form-control form-input" required value="{{ rec['title'] if rec else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label text-muted">Content</label>
            <textarea name="content" class="form-control form-input" rows="6" required>{{ rec['content'] if rec else '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-purple">{{ 'Update' if rec else 'Create' }}</button>
            <a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
